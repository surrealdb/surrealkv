[package]
name = "surrealkv-compat-indxdb"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Pure-Rust and WASM reader and migrator for SurrealDB legacy IndexedDB (indxdb://) stores"

[dependencies]
thiserror = "2"
log = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
	"DomException",
	"DomStringList",
	"Event",
	"IdbDatabase",
	"IdbFactory",
	"IdbKeyRange",
	"IdbObjectStore",
	"IdbOpenDbRequest",
	"IdbRequest",
	"IdbTransaction",
	"IdbTransactionMode",
	"IdbCursor",
	"IdbCursorWithValue",
	"Window",
	"WorkerGlobalScope",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile = "3.10"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

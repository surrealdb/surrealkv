[package]
name = "surrealkv-compat-v1"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/surrealdb/surrealkv"
description = "Standalone reader of SurrealKV LSMV1 databases (v0.20 to v0.21.4), for conversion to LSMV2"

# The checksum and compression this reads are exactly what v0.20.0 to v0.21.4 used: CRC-32 for
# table blocks and log records (`crc32fast`), snappy for table blocks (`snap`) and LZ4 for log
# records (`lz4_flex`). Nothing in those releases used zstd.
[dependencies]
crc32fast = "1.2"
lz4_flex = "0.12"
snap = "1.0"
thiserror = "2"

[dev-dependencies]
tempfile = "3.10"

[lints.clippy]
# The calls that clippy.toml at the root lists are the engine's to route through its file system
# seam, and are not this crate's concern.
disallowed_methods = "allow"

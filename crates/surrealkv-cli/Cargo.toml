[package]
name = "surrealkv-cli"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Operator and developer inspection, dump, and diagnostic CLI for SurrealKV"

[[bin]]
name = "skv"
path = "src/main.rs"

[features]
default = ["encryption"]
# Builds the tool on the library with encryption at rest, so that it can read and write encrypted
# databases. Without it a key is refused by the library's guard.
encryption = ["surrealkv/encryption"]

[dependencies]
surrealkv = { path = "../..", version = "1.0.0", default-features = false }
surrealkv-compat-rocksdb = { path = "../surrealkv-compat-rocksdb" }
surrealkv-compat-v1 = { path = "../surrealkv-compat-v1" }
surrealkv-compat-indxdb = { path = "../surrealkv-compat-indxdb" }
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
indicatif = "0.17"
tabled = "0.16"
anyhow = "1.0"
tokio = { version = "1.36", features = ["full"] }
crc32fast = "1.2"
tracing-subscriber = { version = "0.3", features = ["fmt","env-filter"]}

[dev-dependencies]
tempfile = "3.10"

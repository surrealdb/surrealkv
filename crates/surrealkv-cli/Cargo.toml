[package]
name = "surrealkv-cli"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Operator and developer inspection, dump, and diagnostic CLI for SurrealKV"

[[bin]]
name = "skv"
path = "src/main.rs"

[features]
# Builds the tool on the library with the guard that refuses a key manager compiled out, so that
# it can read and write encrypted databases while encryption is a preview. Off by default, so
# that `cargo test --workspace` links the library with the guard in place. Never use it for
# data that is meant to be kept: the formats are not final.
encryption-preview = ["surrealkv/encryption-preview"]

[dependencies]
surrealkv = { path = "../..", version = "0.21.3" }
surrealkv-compat-rocksdb = { path = "../surrealkv-compat-rocksdb" }
surrealkv-compat-v1 = { path = "../surrealkv-compat-v1" }
surrealkv-compat-indxdb = { path = "../surrealkv-compat-indxdb" }
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
indicatif = "0.17"
tabled = "0.16"
anyhow = "1.0"
tokio = { version = "1.36", features = ["full"] }
crc32fast = "1.2"
tracing-subscriber = { version = "0.3", features = ["fmt","env-filter"]}

[dev-dependencies]
tempfile = "3.10"

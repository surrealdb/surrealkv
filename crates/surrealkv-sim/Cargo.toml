[package]
name = "surrealkv-sim"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Deterministic Simulation Testing (DST) and differential testing oracle for SurrealKV"

[[bin]]
name = "surrealkv-sim"
path = "src/bin/sim.rs"

[dependencies]
surrealkv = { path = "../..", version = "1.1.0" }
tokio = { version = "1.36", features = ["rt", "rt-multi-thread", "sync", "macros", "time"] }
rand = "0.9.2"
tempfile = "3.10.1"

[dev-dependencies]
test-log = { version = "0.2.18", default-features = false, features = ["trace"] }
tokio = { version = "1.39.2", features = ["full"] }

[lints.clippy]
# The calls that clippy.toml at the root lists are the engine's to route through its file system
# seam, and are not this crate's concern.
disallowed_methods = "allow"

# The calls that go through the file system seam (`src/vfs`) and not through `std::fs`.
#
# A database in a browser lives in a pool of files that `std::fs` cannot see: a call that names the
# operating system's file system anywhere on the path that opens or writes a database answers
# "not there" or writes where nothing reads, and no test that runs on a native build notices. The
# lint `clippy::disallowed_methods` finds every such call. It is `deny` for the library in
# `Cargo.toml`. A module that stays on `std::fs` on purpose (the native file system itself, the
# migrators, checkpoints, `inspect`, encryption keys and sealed files, the lock file) carries a
# module-level or item-level `#[allow(clippy::disallowed_methods, reason = "...")]` that says why,
# the library root allows the lint for test code, and `scripts/check-fs-lint.sh --audit` lists them.
#
# Exact paths only. `clippy.toml` takes no wildcards and no braces: a path such as `std::fs::*` is
# not an error, it is a warning that matches nothing, so most of `std::fs` would go unseen.
# `allow-invalid` keeps a path that a toolchain does not have (a function that was added or moved)
# from becoming a warning, and `scripts/check-fs-lint.sh --self-test` runs every entry against a
# fixture, so a path that is mistyped is found there and not by a build that finds nothing.
#
# A member crate of the workspace reads this file too, and every one of them sets the lint to
# `allow` in its `Cargo.toml`.
disallowed-methods = [
	{ path = "std::fs::read", reason = "go through the file system seam in src/vfs", allow-invalid = true },
	{ path = "std::fs::read_to_string", reason = "go through the file system seam in src/vfs", allow-invalid = true },
	{ path = "std::fs::write", reason = "go through the file system seam in src/vfs", allow-invalid = true },
	{ path = "std::fs::copy", reason = "go through the file system seam in src/vfs", allow-invalid = true },
	{ path = "std::fs::rename", reason = "go through the file system seam in src/vfs", allow-invalid = true },
	{ path = "std::fs::remove_file", reason = "go through the file system seam in src/vfs", allow-invalid = true },
	{ path = "std::fs::remove_dir", reason = "go through the file system seam in src/vfs", allow-invalid = true },
	{ path = "std::fs::remove_dir_all", reason = "go through the file system seam in src/vfs", allow-invalid = true },
	{ path = "std::fs::create_dir", reason = "go through the file system seam in src/vfs", allow-invalid = true },
	{ path = "std::fs::create_dir_all", reason = "go through the file system seam in src/vfs", allow-invalid = true },
	{ path = "std::fs::read_dir", reason = "go through the file system seam in src/vfs", allow-invalid = true },
	{ path = "std::fs::metadata", reason = "go through the file system seam in src/vfs", allow-invalid = true },
	{ path = "std::fs::symlink_metadata", reason = "go through the file system seam in src/vfs", allow-invalid = true },
	{ path = "std::fs::canonicalize", reason = "go through the file system seam in src/vfs", allow-invalid = true },
	{ path = "std::fs::hard_link", reason = "go through the file system seam in src/vfs", allow-invalid = true },
	{ path = "std::fs::read_link", reason = "go through the file system seam in src/vfs", allow-invalid = true },
	{ path = "std::fs::set_permissions", reason = "go through the file system seam in src/vfs", allow-invalid = true },
	{ path = "std::fs::exists", reason = "go through the file system seam in src/vfs", allow-invalid = true },

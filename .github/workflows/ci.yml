name: CI

run-name: "CI run '${{ github.head_ref || github.ref_name }}'"

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  build-test:
    strategy:
      matrix:
        target: [ 'x86_64-unknown-linux-gnu', 'aarch64-unknown-linux-gnu', 'x86_64-pc-windows-msvc', 'x86_64-apple-darwin', 'aarch64-apple-darwin' ]
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest


    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Install cross-compilation toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build
        run: cargo build --target=${{ matrix.target }}

      - name: Run tests
        if: ${{ !contains(matrix.os, 'windows') }}
        # Skip tests on Windows as compaction tests and some file system operations are not supported
        env:
          SURREALKV_SIM_SEEDS: 500
          SURREALKV_SIM_STEPS: 5000
        run: make test

  ci:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: --deny warnings

    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install cargo-deny
        run: which cargo-deny || cargo install --debug --locked cargo-deny@0.14.24

      - name: License check
        run: cargo deny check licenses

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Nothing outside src/rt.rs may call a clock, a timer, a spawner or a thread that panics or
      # hangs in a browser. The self-test checks that the guard still refuses what it should.
      - name: Runtime shim guard
        run: |
          scripts/check-rt-guard.sh --self-test
          scripts/check-rt-guard.sh

      # The typed error of a file pool that has no free file must pass through every place that
      # lets an encryption error through unchanged, or a pool a moment from having a file stops the
      # database. The self-test checks that the guard still refuses a missing arm.
      - name: Pool error passthrough guard
        run: |
          scripts/check-passthrough.sh --self-test
          scripts/check-passthrough.sh

      # The calls that must go through the file system seam (clippy.toml) are denied by the Clippy
      # steps (`clippy::disallowed_methods`), but clippy.toml matches exact paths only: an entry
      # that is a wildcard or is mistyped is not an error, it matches nothing. This runs every
      # entry against a fixture with the lint denied, so that such an entry is found here. It also
      # checks that nobody lowered the levels that keep the seam enforced: the library at `deny`,
      # no blanket allow outside test code, and a reason on every allow.
      - name: File system lint list
        run: scripts/check-fs-lint.sh --self-test

      # The browser job checks the archive that a real wasm32 build writes. This checks the check,
      # on fixtures, so that a change to the script cannot make that step pass on anything.
      - name: Zstd archive guard
        run: scripts/check-zstd-archive.sh --self-test

  # Encryption is on by default, so the normal jobs cover it. Build and test without it here, to
  # keep the guard that rejects a key manager from rotting.
  no-encryption:
    name: Without the encryption feature
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: --deny warnings

    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable
        with:
          toolchain: stable
          components: clippy

      - name: Clippy
        run: cargo clippy -p surrealkv --all-targets --no-default-features -- -D warnings

      - name: Test
        run: cargo test -p surrealkv --no-default-features --test encryption_guard

      # The command line tool built on the library without encryption: a key is refused by the
      # guard, and the tests of that run here and nowhere else.
      - name: Clippy (skv)
        run: cargo clippy -p surrealkv-cli --all-targets --no-default-features -- -D warnings

      - name: Test (skv)
        run: cargo test -p surrealkv-cli --no-default-features

  # The engine's own tests, over the memory file system instead of the operating system's: the
  # same pool of files that the browser uses (src/vfs/pool.rs), without a browser. Native
  # behaviour over `std::fs` is what build-test runs; these two check the engine against the
  # pool's contract, and `native-mem-strict` also against its strictest settings: no background
  # refill, and a second raw open of a file is an error. A test that needs a real directory, or
  # a feature that the pool does not have (encryption, checkpoints), skips itself.
  native-mem:
    name: Native tests over the memory file system
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable
        with:
          toolchain: stable

      - name: Test
        env:
          RUST_BACKTRACE: 1
          SURREALKV_TEST_FS: mem
        run: cargo test -p surrealkv --lib

  native-mem-strict:
    name: Native tests over the strict memory file system
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable
        with:
          toolchain: stable

      # One test at a time: the strict settings are meant for tests that run on one thread.
      - name: Test
        env:
          RUST_BACKTRACE: 1
          SURREALKV_TEST_FS: mem-strict
        run: cargo test -p surrealkv --lib -- --test-threads=1

  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # nightly
        with:
          toolchain: nightly
          components: rustfmt

      - name: Format
        run: cargo +nightly fmt --all -- --check

  readme:
    name: README Sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Regenerate CARGO.md
        run: make readme

      - name: Check CARGO.md matches README.md (run make readme to fix)
        run: git diff --exit-code -- CARGO.md

  wasm-check:
    name: WASM Check & Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Check WASM
        run: cargo check --target wasm32-unknown-unknown -p surrealkv -p surrealkv-compat-indxdb -p surrealkv-compat-v1 -p surrealkv-compat-rocksdb

      - name: Clippy WASM
        run: cargo clippy --target wasm32-unknown-unknown -p surrealkv -p surrealkv-compat-indxdb -p surrealkv-compat-v1 -p surrealkv-compat-rocksdb -- -D warnings

      - name: Build WASM
        run: cargo build --target wasm32-unknown-unknown -p surrealkv -p surrealkv-compat-indxdb -p surrealkv-compat-v1 -p surrealkv-compat-rocksdb

  wasm-test:
    name: WASM Test (browser)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with:
          # Pinned: with the default, the action once installed wasm-pack v0.9.1, which does not
          # accept `--test`, and the browser step failed before it ran any test.
          version: v0.15.0

      # The browser tests link the whole engine, zstd's C code included. That is compiled by
      # clang, and archived by the archiver of the target: GNU `ar` and Apple's write no symbol
      # index for WebAssembly objects (an archive without members on macOS), and rust-lld then
      # reports every zstd symbol as undefined. Both must be LLVM's, and the job stops here with a
      # clear message if the runner does not have them. On ubuntu-latest there is an unversioned
      # `clang` and only a versioned `llvm-ar` (llvm-ar-18 when this was written), hence the
      # fallback to the highest numbered one.
      - name: Select the C toolchain for wasm32
        run: |
          CLANG=$(command -v clang || ls /usr/bin/clang-[0-9]* 2>/dev/null | sort -V | tail -n 1)
          LLVM_AR=$(command -v llvm-ar || ls /usr/bin/llvm-ar-[0-9]* 2>/dev/null | sort -V | tail -n 1)
          if [ ! -x "$CLANG" ] || [ ! -x "$LLVM_AR" ]; then
            echo "clang and llvm-ar are needed to link zstd for wasm32, and this runner has none" >&2
            exit 1
          fi
          echo "CC_wasm32_unknown_unknown=$CLANG" >> "$GITHUB_ENV"
          echo "AR_wasm32_unknown_unknown=$LLVM_AR" >> "$GITHUB_ENV"

      - name: Run WASM tests in Browser (Headless Chrome)
        id: chrome
        run: |
          set -euo pipefail
          # Every tests/opfs_*.rs target runs in headless Chrome. Each one picks its own context
          # (a dedicated worker, or the main thread for opfs_window_test) with
          # wasm_bindgen_test_configure!, and the default below only covers a target that does not.
          # The runner gives a whole test binary 20 seconds by default (WASM_BINDGEN_TEST_TIMEOUT
          # is that limit in seconds). The engine test (tests/opfs_engine_test.rs) opens, fills,
          # compacts, closes and crashes a database twice in one binary and is given more.
          # A target that fails does not stop the others, so that one run shows every failure, but
          # the step fails at the end if any did.
          failed=""
          run_chrome() {
            label=$1
            limit=$2
            shift 2
            echo "::group::Running $label"
            if ! WASM_BINDGEN_TEST_TIMEOUT="$limit" WASM_BINDGEN_USE_DEDICATED_WORKER=1 wasm-pack test --headless --chrome "$@"; then
              failed="$failed $label"
            fi
            echo "::endgroup::"
          }
          found=0
          for test in tests/opfs_*.rs; do
            [ -e "$test" ] || continue
            found=$((found + 1))
            name=$(basename "$test" .rs)
            case "$name" in
              opfs_engine_test) limit=600 ;;
              # Copies a legacy database in many ways, and drops the call at every moment of one.
              opfs_migrate_test) limit=300 ;;
              *) limit=120 ;;
            esac
            run_chrome "$name" "$limit" --test "$name"
          done
          if [ "$found" -eq 0 ]; then
            echo "no tests/opfs_*.rs target found" >&2
            exit 1
          fi
          # The unit tests that need a browser: the runtime shim, the clock, the error handler and
          # the raw OPFS backend (src/rt.rs, src/wasm_tests.rs, src/vfs/opfs_raw_tests.rs), which
          # are not reachable from tests/. This links the whole engine, zstd's C code included.
          run_chrome "unit tests (--lib)" 300 -- --lib
          # The IndexedDB reader runs on the page. Its tests drop a read at every moment of it, one
          # database each, and the runner's default of 20 seconds for a whole binary is short for them
          # on a slow machine.
          echo "::group::Running surrealkv-compat-indxdb"
          if ! WASM_BINDGEN_TEST_TIMEOUT=120 wasm-pack test --headless --chrome crates/surrealkv-compat-indxdb; then
            failed="$failed surrealkv-compat-indxdb"
          fi
          echo "::endgroup::"
          if [ -n "$failed" ]; then
            echo "Failed in headless Chrome:$failed" >&2
            exit 1
          fi

      # Looks at the archive of zstd's C code that the build above wrote, whether or not the tests
      # ran: if the link failed, this says why. A run that has no archive in the cached target
      # directory (a cache can restore the compiled crates without their build directories) has
      # nothing to check, and says so.
      - name: Check the zstd archive of the wasm32 build
        if: ${{ !cancelled() && steps.chrome.outcome != 'skipped' }}
        run: scripts/check-zstd-archive.sh --allow-none target/wasm32-unknown-unknown

  apple-targets:
    name: Apple Ecosystem (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-ios
          - aarch64-apple-ios-sim
          - aarch64-apple-tvos
          - aarch64-apple-tvos-sim
          - aarch64-apple-visionos
          - aarch64-apple-visionos-sim
          - aarch64-apple-watchos
          - aarch64-apple-watchos-sim
    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --target ${{ matrix.target }}

  android-target:
    name: Android Ecosystem (aarch64-linux-android)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - name: Configure Android NDK toolchain
        run: |
          NDK_PATH="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          if [ -z "$NDK_PATH" ] || [ ! -d "$NDK_PATH" ]; then
            NDK_PATH="$(ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | sort -V | tail -n 1)"
          fi
          TOOLCHAIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64"
          CLANG_BIN="$(find "$TOOLCHAIN/bin" -name "aarch64-linux-android*-clang" | grep -v '++' | sort -V | tail -n 1)"
          LLVM_AR="$TOOLCHAIN/bin/llvm-ar"
          echo "CC_aarch64_linux_android=$CLANG_BIN" >> $GITHUB_ENV
          echo "AR_aarch64_linux_android=$LLVM_AR" >> $GITHUB_ENV
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_AR=$LLVM_AR" >> $GITHUB_ENV
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$CLANG_BIN" >> $GITHUB_ENV

      - name: Build
        run: cargo build --target aarch64-linux-android

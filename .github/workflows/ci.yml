name: CI

run-name: "CI run '${{ github.head_ref || github.ref_name }}'"

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  build-test:
    strategy:
      matrix:
        target: [ 'x86_64-unknown-linux-gnu', 'aarch64-unknown-linux-gnu', 'x86_64-pc-windows-msvc', 'x86_64-apple-darwin', 'aarch64-apple-darwin' ]
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest


    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Build
        run: cargo build --target=${{ matrix.target }}

      - name: Run tests
        if: ${{ !contains(matrix.os, 'windows') }}
        # Skip tests on Windows as compaction tests and some file system operations are not supported
        env:
          SURREALKV_SIM_SEEDS: 500
          SURREALKV_SIM_STEPS: 5000
        run: make test

  ci:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: --deny warnings

    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install cargo-deny
        run: which cargo-deny || cargo install --debug --locked cargo-deny@0.14.24

      - name: License check
        run: cargo deny check licenses

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
  
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # nightly
        with:
          toolchain: nightly
          components: rustfmt

      - name: Format
        run: cargo +nightly fmt --all -- --check

  wasm-check:
    name: WASM Check & Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown, wasm32-wasip1
          components: clippy

      - name: Check WASM (unknown-unknown)
        run: cargo check --target wasm32-unknown-unknown -p surrealkv -p surrealkv-compat-indxdb -p surrealkv-compat-v1 -p surrealkv-compat-rocksdb

      - name: Clippy WASM (unknown-unknown)
        run: cargo clippy --target wasm32-unknown-unknown -p surrealkv -p surrealkv-compat-indxdb -p surrealkv-compat-v1 -p surrealkv-compat-rocksdb -- -D warnings

      - name: Check WASM (WASI)
        run: cargo check --target wasm32-wasip1 -p surrealkv -p surrealkv-compat-indxdb -p surrealkv-compat-v1 -p surrealkv-compat-rocksdb

      - name: Clippy WASM (WASI)
        run: cargo clippy --target wasm32-wasip1 -p surrealkv -p surrealkv-compat-indxdb -p surrealkv-compat-v1 -p surrealkv-compat-rocksdb -- -D warnings

      - name: Build WASM
        run: |
          cargo build --target wasm32-unknown-unknown -p surrealkv -p surrealkv-compat-indxdb -p surrealkv-compat-v1 -p surrealkv-compat-rocksdb
          cargo build --target wasm32-wasip1 -p surrealkv -p surrealkv-compat-indxdb -p surrealkv-compat-v1 -p surrealkv-compat-rocksdb

  wasm-test:
    name: WASM Test (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, bun, deno, browser]
    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown, wasm32-wasip1

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0

      - name: Setup Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Deno
        if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@041b854f97b325bd60e83716c7cf2360aba5cbca # v2

      - name: Run WASM tests in Node.js
        if: matrix.runtime == 'node'
        run: |
          cargo build --target wasm32-wasip1 --example wasi_fs_test
          node --experimental-wasi-unstable-preview1 tests/run_wasi.mjs target/wasm32-wasip1/debug/examples/wasi_fs_test.wasm
          wasm-pack test --node crates/surrealkv-compat-indxdb

      - name: Run WASM tests in Bun
        if: matrix.runtime == 'bun'
        run: |
          cargo build --target wasm32-wasip1 --example wasi_fs_test
          bun tests/run_wasi.mjs target/wasm32-wasip1/debug/examples/wasi_fs_test.wasm
          mkdir -p /tmp/bun-bin
          printf 'delete globalThis.self;\n' > /tmp/bun-preload.js
          cat << 'EOF' > /tmp/bun-bin/node
          #!/bin/sh
          exec bun -r /tmp/bun-preload.js "$@"
          EOF
          chmod +x /tmp/bun-bin/node
          PATH=/tmp/bun-bin:$PATH wasm-pack test --node crates/surrealkv-compat-indxdb

      - name: Run WASM tests in Deno
        if: matrix.runtime == 'deno'
        run: |
          cargo build --target wasm32-wasip1 --example wasi_fs_test
          deno run --allow-all tests/run_wasi.mjs target/wasm32-wasip1/debug/examples/wasi_fs_test.wasm
          wasm-pack test --node crates/surrealkv-compat-indxdb -- --help
          RUNNER=$(find ~/.cache ~/.cargo /home/runner -path "*/wasm-bindgen-cargo-install-*/wasm-bindgen-test-runner" 2>/dev/null | head -n 1)
          if [ -z "$RUNNER" ]; then
            RUNNER=$(find ~/.cache ~/.cargo /home/runner -name wasm-bindgen-test-runner 2>/dev/null | head -n 1)
          fi
          mkdir -p /tmp/deno-bin
          printf 'globalThis.window = globalThis;\n' > /tmp/deno-preload.js
          REAL_DENO=$(which -a deno | grep -v "/tmp/deno-bin" | head -n 1)
          cat << EOF > /tmp/deno-bin/deno
          #!/bin/sh
          if [ "\$1" = "run" ]; then
              shift
              exec "$REAL_DENO" run --preload=/tmp/deno-preload.js "\$@"
          else
              exec "$REAL_DENO" "\$@"
          fi
          EOF
          chmod +x /tmp/deno-bin/deno
          PATH=/tmp/deno-bin:$PATH CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER="$RUNNER" WASM_BINDGEN_USE_DENO=1 cargo test --target wasm32-unknown-unknown -p surrealkv-compat-indxdb

      - name: Run WASM tests in Browser (Headless Chrome)
        if: matrix.runtime == 'browser'
        run: |
          WASM_BINDGEN_USE_DEDICATED_WORKER=1 wasm-pack test --headless --chrome --test opfs_worker_test
          wasm-pack test --headless --chrome crates/surrealkv-compat-indxdb
